<style>
/* Layout: sticky header with kente band; one centered column (max 1080px); planner uses chip tabs; cards only for records */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#E9EEE7; --ink:#14201A; --muted:#56665D; --line:#D7DFD5;
  --accent:#0D6847; --accent-ink:#FFFFFF; --gold:#C98A12; --gold-soft:#F6E7C4; --gold-ink:#7A5208; --red:#A93A2C; --red-soft:#F5DEDA; --ok-soft:#D8EEE2;
  --display:"Merriweather", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px; --logo-halo:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --sunk:#1D2923; --ink:#E6EDE8; --muted:#9BACA2; --line:#2B3A33;
  --accent:#3DB085; --accent-ink:#06120D; --gold:#E7B34A; --gold-soft:#3A2F17; --gold-ink:#F0C66B; --red:#E46F5F; --red-soft:#3D221E; --ok-soft:#18392B; --logo-halo:drop-shadow(0 0 1px rgba(255,236,220,.55)) drop-shadow(0 0 3px rgba(255,236,220,.25)); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --sunk:#1D2923; --ink:#E6EDE8; --muted:#9BACA2; --line:#2B3A33;
  --accent:#3DB085; --accent-ink:#06120D; --gold:#E7B34A; --gold-soft:#3A2F17; --gold-ink:#F0C66B; --red:#E46F5F; --red-soft:#3D221E; --ok-soft:#18392B; --logo-halo:drop-shadow(0 0 1px rgba(255,236,220,.55)) drop-shadow(0 0 3px rgba(255,236,220,.25)); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,44px);font-weight:700}
h2{font-size:clamp(21px,3.4vw,27px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kente{height:8px;background:
  repeating-linear-gradient(90deg,var(--gold) 0 22px,var(--accent) 22px 30px,var(--ink) 30px 33px,var(--red) 33px 43px,var(--ink) 43px 46px,var(--accent) 46px 54px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--display);font-size:22px;font-weight:700}
.logo{width:36px;height:34px;flex:none;filter:var(--logo-halo)}
nav.main{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap}
.langsel{order:3;width:auto;flex:0 0 auto;padding:6px 8px;font-size:13px;border-radius:999px}
nav.main{order:2;flex:0 1 auto;min-width:0}
@media (max-width:760px){.langsel{order:1}nav.main{flex-basis:100%}}
@media (min-width:761px){.bar{flex-wrap:nowrap}nav.main{flex-wrap:wrap;justify-content:flex-end;overflow:visible;row-gap:4px}html:not([lang=en]) nav.main a{padding:7px 8px}}
/* Wide screens: logo at the far left, language menu at the far right, all tabs on one line between them. */
@media (min-width:1024px){header.top .bar{max-width:none;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .brand{margin-right:0}nav.main{flex:1 1 auto;justify-content:center;flex-wrap:wrap;gap:2px}nav.main a{padding:7px 10px}html:not([lang=en]) nav.main a{padding:7px 7px}}
@media (min-width:1024px) and (max-width:1359px){nav.main a,html:not([lang=en]) nav.main a{padding:6px 7px;font-size:14px}nav.main .sep{margin:0 3px}}
@media (min-width:1024px) and (max-width:1199px){nav.main a,html:not([lang=en]) nav.main a{padding:6px 5px;font-size:13.5px}.brand b{font-size:20px}}
nav.main a.on{background:var(--sunk);color:var(--ink)}
nav.main{align-items:center}
nav.main .sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
nav.main a.couple{color:var(--accent);border:1px solid var(--line)}
nav.main a.couple.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lock{display:inline-block;width:10px;height:8px;border:2px solid currentColor;border-radius:2px;position:relative;margin-right:6px;top:1px}
.lock::before{content:"";position:absolute;left:0;top:-7px;width:6px;height:6px;border:2px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.zone{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface)}
.zone.private{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zone.private .muted{color:inherit;opacity:.85}
.zone.private .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.zone .tagline{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.auth{max-width:440px;margin:0 auto}

.hero-in{max-width:980px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hero-photo h1{font-size:clamp(30px,5.2vw,58px);font-weight:400;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero-photo p{font-size:clamp(15px,1.6vw,19px);line-height:1.6;max-width:72ch;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.btn.hero-btn{background:#4B5E57;border-color:#4B5E57;color:#fff;font-weight:500;font-size:17px;padding:12px 22px;border-radius:4px}
.btn.hero-btn:hover{background:#3d4e48;border-color:#fff}
.btn.hero-btn.hero-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.85)}
.btn.hero-btn.hero-ghost:hover{background:rgba(255,255,255,.18)}
.tile{--t0:#0D6847;--t1:#B9780C;--t2:#A93A2C;--t3:#2E3F37;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;max-width:100%;background:var(--t0)}
.tile.t1{background:var(--t1)}.tile.t2{background:var(--t2)}.tile.t3{background:var(--t3)}
.tile::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#E7B34A 0 14px,#0D6847 14px 20px,#14201A 20px 22px,#A93A2C 22px 30px)}
.tile svg{width:40%;max-width:76px;height:auto;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.catcard{display:flex;flex-direction:column;gap:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;color:var(--ink)}
.vcard > .tile{aspect-ratio:auto;height:150px}
.vgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.catcard:hover{border-color:var(--muted)}
.catcard > span{display:flex;flex-direction:column;padding:10px 12px;gap:2px;font-size:14px}
.fs{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.plain{border:0;padding:0;margin:0;min-width:0}.readonly .x,.readonly [data-act=addstory],.readonly [data-act=delstory],.readonly label.btn{display:none}.readonly input:disabled,.readonly select:disabled,.readonly textarea:disabled{color:var(--ink);opacity:1;background:var(--sunk)}
.fs legend{font-weight:700;font-size:13px;padding:0 6px;color:var(--ink)}
.stars{color:var(--gold);letter-spacing:1px}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-family:var(--display);font-weight:700;max-width:100%}
.about-owner{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.about-owner > div{flex:1 1 260px}
.prose p{max-width:68ch;font-size:16px}
body.editing [data-edit]{outline:1.5px dashed var(--gold);outline-offset:2px;border-radius:3px;cursor:text;white-space:pre-line}
body.editing [data-edit]:hover{background:var(--gold-soft);color:var(--ink)}
body.editing [data-edit]:focus{outline:2px solid var(--gold);background:var(--surface);color:var(--ink)}
#editbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));font-size:14px}
body.editing{padding-bottom:70px}
body.editing .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.p-feat{background:var(--gold-soft);color:var(--gold-ink,#7A5208)}
.vcard.feat{border:2px solid var(--gold)}
.plans{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:stretch}
.plan-feat{border:2px solid var(--gold)}
.price{font-family:Merriweather,serif;font-size:26px;font-weight:700}
.ticks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ticks li{padding-left:22px;position:relative;font-size:14px}
.ticks li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}
.docrow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.docrow img,.docicon{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.docicon{display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-weight:800;font-size:12px}
.photos.sm{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.06em;background:var(--sunk);padding:2px 8px;border-radius:6px;user-select:all}
main{padding-block:28px 64px}
.demo-note{background:var(--gold-soft);color:var(--ink);font-size:13px;padding-block:7px}
.demo-note .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--red)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.adet{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
.adet summary{cursor:pointer;font-weight:600;font-size:14px}
.adet .kv dd{overflow-wrap:anywhere}
button.zoom{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
button.zoom img{display:block}
.photos button.zoom{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk)}
.tipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tipcard{display:flex;flex-direction:column;gap:8px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.tipcard:hover{border-color:var(--gold)}
.tipcard h3{font-size:18px}
article.tip{max-width:720px}
article.tip h2{font-size:22px;margin-top:10px}
article.tip ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
article.tip p.lead{font-size:18px}
.covertag,.mkcover{position:absolute;left:6px;bottom:6px;font-size:12px;padding:3px 8px;border-radius:999px;border:0}
.covertag{background:var(--gold);color:#1a1a1a;font-weight:700}
.mkcover{background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.pkrow{display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:8px;align-items:end}
.pkrow+.pkrow{border-top:1px dashed var(--line);padding-top:10px}
@media (max-width:560px){.pkrow{grid-template-columns:1fr 1fr auto}.pkrow label:first-child{grid-column:1/-1}}
.cedi{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.cedi:focus-within{outline:2px solid var(--gold);outline-offset:-1px}
.cedi>span{padding:0 4px 0 10px;color:var(--muted);font-weight:700}
.cedi input{border:0!important;box-shadow:none!important;padding-left:2px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > *{font-weight:400;color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-yes{background:var(--ok-soft);color:var(--accent)}
.p-no{background:var(--red-soft);color:var(--red)}
.p-pend{background:var(--gold-soft);color:var(--gold)}
.p-neutral{background:var(--sunk);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card.link{font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%}.card.link:hover{border-color:var(--accent)}.card.link .small{display:block}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--red)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--sunk)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.lead{font-size:18px;color:var(--muted);max-width:56ch}
.feature h3{margin-bottom:4px}
.cloth{border-radius:var(--r);min-height:220px;background:
  repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.18) 26px 30px,transparent 30px 56px),
  repeating-linear-gradient(90deg,var(--gold) 0 28px,var(--accent) 28px 40px,var(--gold) 40px 52px,var(--red) 52px 60px,var(--ink) 60px 64px);
  position:relative;overflow:hidden}
.cloth .tag{position:absolute;left:16px;bottom:16px;right:16px;background:var(--surface);border-radius:8px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.vcard{display:flex;flex-direction:column;gap:10px}
.vcard .pk{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:6px}
.vcard .pk span:last-child{font-weight:700;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.photos figure{margin:0;position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:1;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;font-size:12px;padding:4px 7px;background:rgba(0,0,0,.55);color:#fff}
.photos .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;padding:2px 7px;cursor:pointer}
.site-hero{text-align:center;padding-block:36px 26px;display:flex;flex-direction:column;gap:10px;align-items:center}
.site-hero h1{font-size:clamp(34px,8vw,64px)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--gold);margin-left:8px}
.timeline .t{padding:0 0 18px 18px;position:relative}
.timeline .t::before{content:"";position:absolute;left:-9px;top:4px;width:13px;height:13px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.event{border-top:4px solid var(--accent)}
.event.eng{border-top-color:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:3px;flex:none}
.check input[type=date]{width:auto;height:auto;margin:0}
.check.done span{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script>
(async function(){
const mem={};
/* ---------- Hosted mode: Supabase sync (only when config.js provides keys) ---------- */
const SBC=window.AFROVOWS_SB||null;
const HOSTED=!!(SBC&&SBC.url&&SBC.key&&window.supabase);
const DBX={sb:null,user:null,profile:null,snap:{},up:{},pub:[],timers:{},chains:{},meta:{}};
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s||"");
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function dbErr(e){console.error(e);document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=e&&e.code==="23505"&&/one_listing/.test(e.message||"")?"Extra listings aren't switched on yet. Please contact AfroVows.":"We couldn't save that. Check your connection and try again.";document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function dataUrlBlob(u){const [h,b]=u.split(",");const mime=(h.match(/data:([^;]+)/)||[])[1]||"application/octet-stream";const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function uploadData(u,bucket,folder){if(DBX.up[u])return DBX.up[u];
  const blob=dataUrlBlob(u),ext=blob.type==="application/pdf"?"pdf":blob.type==="image/png"?"png":"jpg",path=folder+"/"+rid()+"."+ext;
  const {error}=await DBX.sb.storage.from(bucket).upload(path,blob,{contentType:blob.type,upsert:false});if(error)throw error;
  const out=bucket==="media"?DBX.sb.storage.from("media").getPublicUrl(path).data.publicUrl:"docs:"+path;DBX.up[u]=out;return out}
async function materialize(o,docsFolder,inDocs){if(!o||typeof o!=="object")return;
  for(const k of Object.keys(o)){const v=o[k];
    if(typeof v==="string"&&v.startsWith("data:")){
      if(inDocs&&k==="src"&&docsFolder)o[k]=await uploadData(v,"docs",docsFolder);
      else if(v.startsWith("data:image/"))o[k]=await uploadData(v,"media","u/"+DBX.user.id)}
    else if(v&&typeof v==="object")await materialize(v,docsFolder,inDocs||k==="docs")}}
function swapUrls(o){if(!o||typeof o!=="object")return;for(const k of Object.keys(o)){const v=o[k];if(typeof v==="string"&&v.startsWith("data:")&&DBX.up[v])o[k]=DBX.up[v];else if(v&&typeof v==="object")swapUrls(v)}}
const LST_COLS=["id","owner","status","note","live","plan","planUntil","planReq","submittedAt","_owner"];
function rowToListing(r){return {...(r.data||{}),id:r.id,owner:r.owner_email,_owner:r.owner,status:r.status,note:r.note||"",live:r.live,plan:r.plan,planUntil:r.plan_until?Date.parse(r.plan_until):null,planReq:r.plan_req,submittedAt:r.submitted_at?Date.parse(r.submitted_at):null}}
function listingToRow(l){const data={};for(const k in l)if(!LST_COLS.includes(k))data[k]=l[k];
  return {id:l.id,status:l.status||"draft",note:l.note||null,data,live:l.live||null,plan:l.plan||"basic",plan_until:l.planUntil?new Date(l.planUntil).toISOString():null,plan_req:l.planReq||null,submitted_at:l.submittedAt?new Date(l.submittedAt).toISOString():null}}
function queue(k,fn){DBX.chains[k]=(DBX.chains[k]||Promise.resolve()).then(fn).catch(dbErr);return DBX.chains[k]}
function onSet(k,v){
  if(k==="afrovows.content"||k==="afrovows.about"){if(!DBX.profile||DBX.profile.role!=="admin")return;
    clearTimeout(DBX.timers[k]);DBX.timers[k]=setTimeout(()=>queue(k,async()=>{const val=JSON.parse(mem[k]);await materialize(val);mem[k]=JSON.stringify(val);
      const {error}=await DBX.sb.from("site_content").upsert({key:k==="afrovows.content"?"content":"about",value:val,updated_at:new Date().toISOString()});if(error)throw error;
      if(k==="afrovows.content"&&window.__avContent)swapUrls(window.__avContent())}),400);return}
  if(k.startsWith("afrovows.w.")){const id=k.slice(11);if(!isUuid(id)||!DBX.user)return;
    clearTimeout(DBX.timers[k]);DBX.timers[k]=setTimeout(()=>queue(k,async()=>{const val=JSON.parse(mem[k]);await materialize(val,id);mem[k]=JSON.stringify(val);
      if(window.__avLive)swapUrls(window.__avLive(id));
      const {error}=await DBX.sb.from("weddings").update({data:val}).eq("id",id);if(error)throw error}),500);return}
  if(k==="afrovows.listings"){if(!DBX.user)return;clearTimeout(DBX.timers[k]);DBX.timers[k]=setTimeout(()=>queue(k,async()=>{
      const cur=JSON.parse(mem[k]||"[]"),prev=DBX.snap[k]||{};const next={};
      for(const l of cur){if(!l||!l.id)continue;const before=prev[l.id];
        if(!DBX.profile||(DBX.profile.role!=="admin"&&l._owner&&l._owner!==DBX.user.id)){next[l.id]=before;continue}
        await materialize(l);const row=listingToRow(l),s=JSON.stringify(row);if(s!==before){
          const q=before?DBX.sb.from("listings").update(row).eq("id",l.id):DBX.sb.from("listings").insert(row);
          const {data,error}=await q.select().single();if(error)throw error;
          Object.assign(l,rowToListing(data));next[l.id]=JSON.stringify(listingToRow(l))}else next[l.id]=before}
      for(const id in prev)if(!(id in next)){const {error}=await DBX.sb.from("listings").delete().eq("id",id);if(error)throw error}
      DBX.snap[k]=next;mem[k]=JSON.stringify(cur)}),300);return}
  if(k==="afrovows.reviews"){if(!DBX.user)return;queue(k,async()=>{const cur=JSON.parse(v||"{}"),prev=DBX.snap[k]||{},next={};
      for(const vid in cur)for(const r of cur[vid]){if(r.sample)continue;const s=JSON.stringify(r);next[r.id]=s;
        if(prev[r.id]!==s&&r.by===me){const {error}=await DBX.sb.from("reviews").upsert({id:r.id,vendor_id:vid,author:DBX.user.id,name:r.name,rating:r.rating,text:r.text,hired:!!r.hired,at:new Date(r.at).toISOString()},{onConflict:"vendor_id,author"});if(error)throw error}}
      for(const id in prev)if(!next[id]){const {error}=await DBX.sb.from("reviews").delete().eq("id",id);if(error)throw error}
      DBX.snap[k]=next});return}
  if(k==="afrovows.messages"){queue(k,async()=>{const cur=JSON.parse(v||"[]"),prev=DBX.snap[k]||{},next={};
      for(const m of cur){const s=JSON.stringify(m);next[m.id]=s;
        if(!prev[m.id]){const {error}=await DBX.sb.from("messages").insert({id:m.id,name:m.name,who:m.who,email:m.email,phone:m.phone,msg:m.msg});if(error)throw error}
        else if(prev[m.id]!==s){const {error}=await DBX.sb.from("messages").update({read:!!m.read}).eq("id",m.id);if(error)throw error}}
      for(const id in prev)if(!next[id]){const {error}=await DBX.sb.from("messages").delete().eq("id",id);if(error)throw error}
      DBX.snap[k]=next});return}
}
async function dbBoot(){
  DBX.sb=window.supabase.createClient(SBC.url,SBC.key,{auth:{persistSession:true,autoRefreshToken:true}});const sb=DBX.sb;
  const [{data:sess},{data:site,error:e1},{data:pub,error:e2},{data:revs,error:e3}]=await Promise.all([sb.auth.getSession(),sb.from("site_content").select("key,value"),sb.from("public_listings").select("*"),sb.from("reviews").select("*")]);
  if(e1||e2||e3)throw (e1||e2||e3);
  for(const r of site||[])mem[r.key==="content"?"afrovows.content":"afrovows.about"]=JSON.stringify(r.value);
  DBX.pubAt=Date.now();DBX.pub=(pub||[]).map(r=>({...r.live,id:r.id,sample:false,_plan:r.plan,_until:r.plan_until?Date.parse(r.plan_until):null}));
  DBX.user=sess&&sess.session?sess.session.user:null;
  const accts=[];mem["afrovows.listings.seeded"]="1";mem["afrovows.reviews.seeded"]="1";mem["afrovows.listings"]="[]";
  if(DBX.user){let {data:p}=await sb.from("profiles").select("*").eq("id",DBX.user.id).maybeSingle();
    const meta=DBX.user.user_metadata||{};
    DBX.profile=p;

   <p class="small muted">These guides are general information to help you plan. Rules, fees and forms can change, so check with the office concerned.</p></div>`}

/* ---------- Planner ---------- */
const PTABS=[["overview","Overview"],["budget","Budget"],["myvendors","My vendors"],["todo","To-do"],["guests","Guests & RSVP"],["party","Bridal party"],["team","Team"],["photos","Photos"],["details","Story & details"]];
function vPlanner(){
  const w=S.wedding,lim=partyOnly();if(ui.ptab==="party"&&!seesParty())ui.ptab="overview";if(lim&&!BP_TABS.includes(ui.ptab))ui.ptab="party";
  const tabs=PTABS.filter(t=>(t[0]!=="party"||seesParty())&&(!lim||BP_TABS.includes(t[0])));
  const asks=isCoupleLead()?(S.team||[]).filter(t=>t.status==="requested").length:0;
  return `<div class="stack">
   <div class="split"><div><span class="eyebrow"><span class="lock" aria-hidden="true"></span>Private planner · only your wedding team can see this</span><h1 style="font-size:clamp(26px,5vw,36px)">${esc(coupleNames())}</h1>
     <p class="small muted">Wedding code for your guests: <span class="code">${esc(myCode())}</span>${meMember()?` · Signed in as <b>${esc(meMember().name)}</b> (${esc(meMember().role)})`:""}</p></div><a class="btn" href="#wedding">Preview guest page</a></div>
   ${asks&&ui.ptab!=="team"?`<div class="card row small" style="justify-content:space-between;background:var(--gold-soft);padding:10px 14px"><span>${asks===1?"1 person is waiting for you to approve them.":asks+" people are waiting for you to approve them."}</span><button class="btn sm pri" data-act="ptab" data-id="team">Review on the Team tab</button></div>`:""}
   <div class="chips" role="tablist">${tabs.map(t=>`<button class="chip ${ui.ptab===t[0]?"on":""}" role="tab" aria-selected="${ui.ptab===t[0]}" data-act="ptab" data-id="${t[0]}">${t[1]}</button>`).join("")}</div>
   <div>${({overview:pOverview,budget:pBudget,guests:pGuests,todo:pTodo,team:pTeam,party:pParty,myvendors:pMyVendors,photos:pPhotos,details:pDetails})[ui.ptab]()}</div></div>`;
}
function budgetTotals(){const it=S.budget.items;return{est:it.reduce((a,b)=>a+(+b.est||0),0),actual:it.reduce((a,b)=>a+(+b.actual||0),0),paid:it.reduce((a,b)=>a+(+b.paid||0),0)}}
function rsvpStats(ev){const gs=S.guests.filter(g=>(g.events||"").split(",").includes(ev));const s={invited:gs.length,yes:0,no:0,pend:0,heads:0};
  gs.forEach(g=>{const r=g.rsvp?.[ev]||"pending";if(r==="yes"){s.yes++;s.heads+=1+plusComing(g)}else if(r==="no")s.no++;else s.pend++});return s}
function pOverview(){
  const w=S.wedding,vAgreed=S.myVendors.reduce((a,v)=>a+(+v.agreed||0),0),vPaid=S.myVendors.reduce((a,v)=>a+(+v.paid||0),0);
  const evCards=w.events.map(e=>{const d=daysTo(e.date),s=rsvpStats(e.id);
    return `<div class="card event ${e.id==="eng"?"eng":""} stack" style="gap:8px"><div class="split"><h3>${esc(e.name)}</h3><span class="pill p-neutral num">${d==null?"No date":d>0?d+" days to go":d===0?"Today":"Done"}</span></div>
    <p class="small muted">${esc(longDate(e.date))} · ${esc(e.venue)}</p>
    <div class="row small num"><span class="pill p-yes">${s.yes} coming</span><span class="pill p-pend">${s.pend} waiting</span><span class="pill p-no">${s.no} not coming</span></div>
    <p class="small">Expected headcount (with plus-ones): <b class="num">${s.heads}</b></p></div>`}).join("");
  const booked=S.myVendors.filter(v=>v.status!=="Enquired").length;
  const done=S.tasks.filter(x=>x.done).length;
  return `<div class="stack">
   <div class="grid g4">
     <button class="card stat link" data-act="ptab" data-id="budget"><span class="small muted">Budget committed</span><b>${Math.round(vAgreed/(S.budget.total||1)*100)}%</b><span class="small muted num">${fmt(vAgreed)} agreed of ${fmt(S.budget.total)}</span></button>
     <button class="card stat link" data-act="ptab" data-id="myvendors"><span class="small muted">Paid so far</span><b>${fmt(vPaid).replace("GH₵ ","₵")}</b><span class="small muted num">Balance due ${fmt(Math.max(0,vAgreed-vPaid))}</span></button>
     <button class="card stat link" data-act="ptab" data-id="guests"><span class="small muted">Guests invited</span><b>${S.guests.length}</b><span class="small muted">${S.guests.filter(g=>Object.values(g.rsvp||{}).includes("pending")).length} still to reply</span></button>
     <button class="card stat link" data-act="ptab" data-id="myvendors"><span class="small muted">Vendors booked</span><b>${booked}</b><span class="small muted">of ${S.myVendors.length} in your list</span></button>
   </div>
   <div class="grid g2">${evCards}</div>
   ${paymentsDue()}
   <div class="card"><div class="split" style="margin-bottom:6px"><h3>Coming up</h3><button class="btn sm" data-act="ptab" data-id="todo">See full to-do list</button></div>
     <p class="small muted num" style="margin-bottom:4px">${done} of ${S.tasks.length} to-dos done</p>
     ${S.tasks.filter(x=>!x.done).sort(byDue).slice(0,5).map(taskRow).join("")||'<p class="small muted">Everything is done. Well planned!</p>'}</div>
  </div>`;
}
function byDue(a,b){return (a.due||"9999").localeCompare(b.due||"9999")}
function dueInfo(x){if(!x.due||x.done)return"";const d=daysTo(x.due);
  return d<0?`<span class="pill p-no">Overdue by ${-d} day${d===-1?"":"s"}</span>`:d===0?'<span class="pill p-pend">Due today</span>':d<=14?`<span class="pill p-pend">Due in ${d} day${d===1?"":"s"}</span>`:""}
function taskRow(x){return `<div class="check ${x.done?"done":""}"><input type="checkbox" data-act="task" data-id="${x.id}" id="tk-${x.id}" ${x.done?"checked":""} aria-label="Mark done">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><label for="tk-${x.id}"><span>${esc(x.t)}</span></label>
   <div class="row" style="gap:8px"><label class="small muted row" style="gap:6px">Who <select data-act="taskwho" data-id="${x.id}" id="tw-${x.id}" style="width:auto;padding:3px 6px;font-size:13px"><option value="">Not assigned</option>${["Bride","Groom"].map(r=>`<option value="${r}" ${x.who===r?"selected":""}>${esc(partnerName(r))} (${r.toLowerCase()})</option>`).join("")}</select></label><label class="small muted row" style="gap:6px">Due <input type="date" data-act="taskdue" data-id="${x.id}" id="td-${x.id}" value="${esc(x.due||"")}" style="width:auto;padding:3px 6px;font-size:13px"></label>${dueInfo(x)}</div></div>
  <button class="btn sm ghost" data-act="deltask" data-id="${x.id}" aria-label="Delete to-do">×</button></div>`}
function pTodo(){
  const anchor=weddingAnchor(),f=ui.twho||"all";
  const vis=x=>f==="all"||(f==="none"?!x.who:x.who===f);
  const groups=PHASES.map(([id,label])=>({id,label,builtin:true})).concat((S.taskGroups||[]).map(g=>({id:g.id,label:g.label,builtin:false})));
  const count=r=>S.tasks.filter(x=>!x.done&&(r==="none"?!x.who:x.who===r)).length;
  return `<div class="stack">${todoDash(groups)}
   <p class="muted small">${anchor?`Counting back from your first ceremony on <b>${esc(longDate(anchor))}</b>. Set a due date and who's in charge of each item.`:`Add your ceremony dates in Story & details to see target dates for each stage.`}</p>
   <div class="chips"><button class="chip ${f==="all"?"on":""}" data-act="twho" data-id="all">Everything</button>${["Bride","Groom"].map(r=>`<button class="chip ${f===r?"on":""}" data-act="twho" data-id="${r}">${esc(partnerName(r))}'s to-dos <span class="num">${count(r)}</span></button>`).join("")}<button class="chip ${f==="none"?"on":""}" data-act="twho" data-id="none">Not assigned <span class="num">${count("none")}</span></button></div>
   ${groups.map(g=>{const all=S.tasks.filter(x=>x.phase===g.id),ts=all.filter(vis).sort(byDue),dn=all.filter(x=>x.done).length,late=all.filter(x=>!x.done&&x.due&&daysTo(x.due)<0).length;
     const pi=PHASES.findIndex(p=>p[0]===g.id);
     return `<section class="card stack" style="gap:6px"><div class="split"><div><h3>${esc(g.label)}</h3>${g.builtin&&anchor?`<span class="small muted">Aim to finish by ${esc(longDate(addDays(anchor,-(PHASES[pi+1]?.[2]??0))))}</span>`:g.builtin?"":'<span class="small muted">Your own group</span>'}</div>
       <div class="row" style="gap:6px">${late?`<span class="pill p-no">${late} overdue</span>`:""}<span class="pill ${dn===all.length&&all.length?"p-yes":"p-neutral"} num">${dn} of ${all.length} done</span>${!g.builtin&&!all.length?`<button class="btn sm ghost danger" data-act="delgroup" data-id="${g.id}">Delete group</button>`:""}</div></div>
       <div class="meter"><i style="width:${all.length?dn/all.length*100:0}%"></i></div>
       <div>${ts.map(taskRow).join("")||`<p class="small muted">${all.length?"Nothing here for this person.":"Nothing here yet."}</p>`}</div>
       <form class="row" data-form="task" data-id="${g.id}" style="margin-top:6px"><input id="nt-${g.id}" name="t" placeholder="Add a to-do" required style="flex:1 1 200px"><select name="who" id="nw-${g.id}" aria-label="Who's in charge" style="width:auto"><option value="">Not assigned</option>${["Bride","Groom"].map(r=>`<option value="${r}" ${f===r?"selected":""}>${esc(partnerName(r))}</option>`).join("")}</select><input type="date" name="due" id="nd-${g.id}" aria-label="Due date" style="width:auto"><button class="btn sm">Add</button></form></section>`}).join("")}
   <form class="card row" data-form="taskgroup" style="border-style:dashed"><b style="flex:1 1 100%">Create your own group</b><input id="ng-label" name="label" required placeholder="e.g. Engagement list items, Honeymoon, Church requirements" style="flex:1 1 240px"><button class="btn pri sm">Create group</button></form>
  </div>`;
}
function todoDash(groups){
  const T=S.tasks,n=T.length,dn=T.filter(x=>x.done).length,open=T.filter(x=>!x.done);
  const late=open.filter(x=>x.due&&daysTo(x.due)<0).length,soon=open.filter(x=>x.due&&daysTo(x.due)>=0&&daysTo(x.due)<=14).length,nodate=open.filter(x=>!x.due).length;
  const pc=n?Math.round(dn/n*100):0;
  const stat=(label,val,sub,style="")=>`<div class="card stat"><span class="small muted">${label}</span><b class="num" style="${style}">${val}</b><span class="small muted num">${sub}</span></div>`;
  const bar=(label,a,b)=>`<div class="stack" style="gap:4px"><div class="split small"><span>${esc(label)}</span><span class="num muted">${a} of ${b} done</span></div><div class="meter"><i style="width:${b?a/b*100:0}%"></i></div></div>`;
  const ppl=[["Bride",partnerName("Bride")],["Groom",partnerName("Groom")],["none","Not assigned"]].map(([r,l])=>{const xs=T.filter(x=>r==="none"?!x.who:x.who===r);return [l,xs.filter(x=>x.done).length,xs.length]}).filter(x=>x[2]);
  return `<div class="grid g4">
    ${stat("Done",pc+"%",`${dn} of ${n} to-dos`,"color:var(--accent)")}
    ${stat("Overdue",late,late?"Past their due date":"Nothing overdue",late?"color:var(--red)":"")}
    ${stat("Due in 2 weeks",soon,"Coming up soon",soon?"color:var(--gold-ink)":"")}
    ${stat("Still to do",open.length,nodate?`${nodate} without a due date`:"All have due dates")}
   </div>
   <div class="grid g2">
    <div class="card stack" style="gap:10px"><h3>Progress by stage</h3>${groups.map(g=>{const xs=T.filter(x=>x.phase===g.id);return xs.length?bar(g.label,xs.filter(x=>x.done).length,xs.length):""}).join("")||'<p class="small muted">No to-dos yet.</p>'}</div>
    <div class="card stack" style="gap:10px"><h3>Progress by person</h3>${ppl.map(x=>bar(...x)).join("")||'<p class="small muted">No to-dos yet.</p>'}</div>
   </div>`;
}
const joinLink=c=>location.origin.replace(/^null$/,"")+location.pathname+"#join="+encodeURIComponent(c);
const joinText=t=>`Hi ${t.name}! You're invited to help plan our wedding on AfroVows${BP_ROLES.includes(t.role)?" as our "+t.role.toLowerCase():""}. Tap this link, then add your name, email and a password to join: ${joinLink(t.code)}`;
function pTeam(){
  const lead=isCoupleLead();
  return `<div class="stack">
   <p class="muted">Everyone here can open this planner and help with the budget, guests, vendors and to-dos, except groomsmen and bridesmaids, who only see the Bridal party, Photos and Story & details tabs. ${lead?"Invite someone, then send them their join link. They type the first and last name you entered, and you approve them before they can see anything.":"Only the bride and groom can invite or remove people."}</p>

function loadPdfJs(){if(window.pdfjsLib&&window.pdfjsWorker)return Promise.resolve(window.pdfjsLib);if(pdfjsP)return pdfjsP;

  pdfjsP=add("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(()=>add("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")).then(()=>window.pdfjsLib).catch(e=>{pdfjsP=null;throw e});return pdfjsP}
async function docView(itemId,docId){const i=docItem(itemId),x=i&&(i.docs||[]).find(d=>d.id===docId);if(!x)return;
  modal(`<div class="split"><div><span class="eyebrow">${esc(DOCT[x.type])}</span><h2 style="word-break:break-word">${esc(x.name)}</h2></div><div class="row"><button class="btn sm" data-act="docs" data-id="${itemId}">Back</button><button class="btn sm ghost" data-act="close" aria-label="Close">×</button></div></div>
   <div id="docbox" class="stack" style="gap:8px">${x.mime.startsWith("image/")&&!x.src.startsWith("docs:")?`<img src="${x.src}" alt="${esc(x.name)}" style="width:100%;border-radius:6px">`:'<p class="small muted">Opening…</p>'}</div>`);
  let bytes;
  if(x.src.startsWith("docs:")){try{const {data,error}=await DBX.sb.storage.from("docs").download(x.src.slice(5));if(error)throw error;
      if(x.mime.startsWith("image/")){const box=$("#docbox");if(box)box.innerHTML=`<img src="${URL.createObjectURL(data)}" alt="${esc(x.name)}" style="width:100%;border-radius:6px">`;return}
      bytes=new Uint8Array(await data.arrayBuffer())}catch(e){const box=$("#docbox");if(box)box.innerHTML='<p class="small">This file couldn\'t be opened. Check your connection and try again.</p>';return}}
  else if(x.mime.startsWith("image/"))return;
  try{const lib=await loadPdfJs();if(!bytes){const bin=atob(x.src.split(",")[1]);bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k)}
    const pdf=await lib.getDocument({data:bytes}).promise;const box=$("#docbox");if(!box)return;box.innerHTML="";
    for(let n=1;n<=Math.min(pdf.numPages,5);n++){const pg=await pdf.getPage(n);const vp=pg.getViewport({scale:1.4});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.cssText="width:100%;border:1px solid var(--line);border-radius:6px;background:#fff";
      box.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}
    if(pdf.numPages>5)box.insertAdjacentHTML("beforeend",`<p class="small muted">Showing the first 5 of ${pdf.numPages} pages.</p>`)}
  catch(e){const box=$("#docbox");if(box)box.innerHTML='<p class="small">This PDF couldn\'t be shown here. It is still saved here.</p>'}}

const VSTAT=["Enquired","Booked","Deposit paid","Paid in full"];
function vendorSummary(){
  const vs=S.myVendors,tot=vs.reduce((a,v)=>a+(+v.agreed||0),0),paid=vs.reduce((a,v)=>a+(+v.paid||0),0),bal=tot-paid,noQuote=vs.filter(v=>!(+v.agreed)).length;
  const bt=budgetTotals(),budget=+S.budget.total||0,base=budget||bt.est,left=base-tot,over=base>0&&tot>base;
  const pct=x=>base>0?Math.round(x/base*100):0,w=x=>base>0?Math.min(100,x/Math.max(base,tot)*100):0;
  const paidPct=tot?Math.round(paid/tot*100):0;
  const stat=(label,val,sub,style="")=>`<div class="card stat"><span class="small muted">${label}</span><b class="num" style="white-space:nowrap;font-size:clamp(19px,5.2vw,26px);${style}">${val}</b><span class="small muted num">${sub}</span></div>`;
  const rows={};
  vs.forEach(v=>{const c=v.cat||"other";(rows[c]||(rows[c]={b:0,a:0,p:0})).a+=+v.agreed||0;rows[c].p+=+v.paid||0});
  S.budget.items.forEach(i=>{const c=bcat(i);(rows[c]||(rows[c]={b:0,a:0,p:0})).b+=+i.est||0});
  const cats=Object.keys(rows).filter(c=>rows[c].a||rows[c].p).sort((x,y)=>rows[y].a-rows[x].a);
  return `<div class="stack" style="gap:12px">
   <div class="grid g4">
    ${stat("Agreed with vendors",fmt(tot),`${vs.length} vendor${vs.length===1?"":"s"}${noQuote?` · ${noQuote} awaiting quote`:""}`)}
    ${stat("Paid so far",fmt(paid),`${paidPct}% of agreed`,"color:var(--accent)")}
    ${stat("Balance to pay",fmt(bal),bal>0?"Still owed to vendors":"All settled",bal>0?"color:var(--gold-ink)":"")}
    ${stat(budget?"Total budget":"Planned budget",fmt(base),base?(over?`Over by ${fmt(tot-base)}`:`${fmt(left)} not yet committed`):`<a href="#budget">Set your budget</a>`,over?"color:var(--red)":"")}
   </div>
   ${paymentsDue()}
   ${S.myVendors.length?docSummary():""}
   ${base?`<div class="card stack" style="gap:10px">
     <div class="split"><h3>Vendors against your budget</h3><span class="small num" style="${over?"color:var(--red);font-weight:700":""}">${over?`Over budget by ${fmt(tot-base)}`:`${pct(tot)}% of budget agreed`}</span></div>
     <div class="meter" style="display:flex;height:14px" role="img" aria-label="Paid ${fmt(paid)}, unpaid ${fmt(Math.max(0,bal))}, budget ${fmt(base)}"><i style="width:${w(paid)}%"></i><i style="width:${w(Math.max(0,bal))}%;background:var(${over?"--red":"--gold"})"></i></div>
     <div class="row small num" style="gap:14px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);vertical-align:-1px"></i> Paid ${fmt(paid)} (${pct(paid)}%)</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);vertical-align:-1px"></i> Agreed, not paid ${fmt(Math.max(0,bal))}</span>${over?"":`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line);vertical-align:-1px"></i> Left in budget ${fmt(left)}</span>`}</div>
     ${!budget?`<span class="small muted">No total budget set, so this compares against the planned items in your <a href="#budget">Budget</a>.</span>`:""}
     ${cats.length?`<div class="tbl"><table style="white-space:nowrap"><thead><tr><th>Service</th><th class="r">Budgeted</th><th class="r">Agreed</th><th class="r">Paid</th><th class="r">Difference</th></tr></thead><tbody>
      ${cats.map(c=>{const r=rows[c],d=r.b-r.a;return `<tr><td>${esc(bcatName(c))}</td><td class="r num">${r.b?fmt(r.b):'<span class="muted">Not budgeted</span>'}</td><td class="r num">${fmt(r.a)}</td><td class="r num">${fmt(r.p)}</td><td class="r num" style="${d<0?"color:var(--red);font-weight:700":"color:var(--accent)"}">${d<0?"Over by "+fmt(-d):d>0?"Under by "+fmt(d):"On budget"}</td></tr>`}).join("")}
     </tbody></table></div>`:""}
   </div>`:""}
  </div>`;
}
const shortDate=d=>new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

function exportRsvp(){const evs=S.wedding.events,lab={yes:"Coming",no:"Not coming",pending:"No reply"};

  const rows=S.guests.map(g=>{const inv=(g.events||"").split(",");return [g.name,String(g.phone||"").replace(/[^\d+]/g,"").replace(/^(\+?\d{3,4})(\d{3})(\d+)$/,"$1 $2 $3").replace(/^\+/,"00"),g.group,g.side,...evs.flatMap(e=>inv.includes(e.id)?["Yes",lab[g.rsvp?.[e.id]||"pending"]||g.rsvp?.[e.id]]:["No",""]),+g.plus||0,g.plusUsed!=null&&g.plusUsed!==""?plusComing(g):"",g.note||""]});
  const tot=evs.map(e=>{const st=rsvpStats(e.id);return st?`${e.name}: ${st.yes} coming, ${st.no} not coming, ${st.pend} no reply, headcount ${st.heads}`:""}).filter(Boolean);
  const csv="\ufeff"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n")+(tot.length?"\r\n\r\n"+tot.map(t=>q(t)).join("\r\n"):"");
  const name=`${S.wedding.p1}-${S.wedding.p2}-rsvp-${new Date().toISOString().slice(0,10)}.csv`.replace(/[^\w.-]+/g,"-");

function listSwitcher(cur){const m=myListings();if(!m.length)return "";

   ${m.length>1?`<div class="chips">${m.map(x=>`<button class="chip ${x.id===cur.id?"on":""}" data-act="pickls" data-id="${x.id}" aria-pressed="${x.id===cur.id}">${esc(x.name||"Untitled listing")}${x.cat?` · ${esc(catName(x.cat))}`:""}</button>`).join("")}</div>`:""}
   ${m.length>1&&cur.id&&!cur.live?`<div><button class="btn sm ghost danger" data-act="dells" data-id="${cur.id}">Delete this listing</button></div>`:""}</section>`}
const LFIELDS=["name","cat","events","contact","email","phone","city","region","areas","years","blurb","deposit","reg","idType","idNo","capMin","capMax"];
/* Venue capacity in guests. capMin/capMax are stored as text from the form; either may be empty. */
function capText(v){const a=+v.capMin||0,b=+v.capMax||0;if(v.cat!=="venues"||(!a&&!b))return "";return a&&b&&a!==b?`${a.toLocaleString("en-GB")} to ${b.toLocaleString("en-GB")} guests`:b?`Up to ${b.toLocaleString("en-GB")} guests`:`From ${a.toLocaleString("en-GB")} guests`}
const CAPS=[["all","Any number of guests"],["100","About 100 guests"],["200","About 200 guests"],["300","About 300 guests"],["500","About 500 guests"],["800","800 or more guests"]];
function fitsCap(v,want){if(want==="all"||v.cat!=="venues")return true;const n=+want,a=+v.capMin||0,b=+v.capMax||0;if(!a&&!b)return false;return (b||Infinity)>=n&&a<=n}
const IDTYPES=["Ghana Card","Driver's licence"];
const money=v=>+String(v||"").replace(/[^\d.]/g,"")||0;
const groupNum=v=>{const n=money(v);return n?n.toLocaleString("en-GB",{maximumFractionDigits:2}):""};
function socials(v){return (v.socials&&v.socials.length?v.socials:(v.social?[v.social]:[])).filter(Boolean)}
function socialLink(x){const u=/^https?:\/\//i.test(x)?x:/^(www\.|[\w-]+\.(com|gh|org|net|me|co)\b)/i.test(x)?"https://"+x:"";return u?`<a href="${esc(u)}" target="_blank" rel="noopener nofollow">${esc(x)}</a>`:esc(x)}
function pkRow(p,i){p=p||{};const first=i===0;return `<div class="pkrow"><label class="f">Package description<input name="pk_name" ${first?"required":""} value="${esc(p.name||"")}" placeholder="e.g. Full day photo coverage"></label>
  <label class="f">Fee<span class="cedi"><span aria-hidden="true">GH₵</span><input name="pk_fee" inputmode="decimal" value="${esc(groupNum(p.price))}" placeholder="0" aria-label="Fee in Ghana cedis"></span></label>
  <label class="f">Per (optional)<input name="pk_unit" value="${esc(p.unit||"")}" placeholder="e.g. per guest"></label>
  <button type="button" class="btn sm ghost danger" data-act="delpkrow" aria-label="Remove this package">×</button></div>`}
function socialRow(x){return `<div class="row socrow" style="gap:6px;flex-wrap:nowrap"><input name="soc" value="${esc(x||"")}" placeholder="e.g. instagram.com/yourbusiness" aria-label="Social media or website link" style="flex:1"><button type="button" class="btn sm ghost danger" data-act="delsocrow" aria-label="Remove this link">×</button></div>`}

function draftFromForm(){const f=document.querySelector('[data-form="listing"]');const fd=f?Object.fromEntries(new FormData(f)):{};
  const l=listings(),cur=myListing();let x=cur&&l.find(v=>v.id===cur.id);if(!x){x={id:"l"+uid(),owner:me,status:"draft",packages:[],gallery:[]};l.push(x);ui.lid=x.id}
  LFIELDS.forEach(k=>{if(fd[k]!==undefined)x[k]=String(fd[k]).trim()});
  if(f){x.packages=[...f.querySelectorAll(".pkrow")].map(r=>({name:r.querySelector("[name=pk_name]").value.trim(),price:money(r.querySelector("[name=pk_fee]").value),unit:r.querySelector("[name=pk_unit]").value.trim()})).filter(p=>p.name);
    x.socials=[...f.querySelectorAll("[name=soc]")].map(i=>i.value.trim()).filter(Boolean);delete x.social}
  return [l,x]}
function statusPill(l){return l.status==="approved"?'<span class="pill p-yes">Live in the directory</span>':l.status==="rejected"?'<span class="pill p-no">Changes needed</span>':l.status==="removed"?'<span class="pill p-no">Unpublished</span>':l.status==="draft"?'<span class="pill p-neutral">Not submitted</span>':'<span class="pill p-pend">Waiting for approval</span>'}
function planModal(id){const p=PLANS.find(x=>x.id===id);if(!p)return;const m=planPrice(id);const name=TV("plan."+id+".name",p.name);
  modal(`<div class="split"><div><span class="eyebrow">Upgrade your listing</span><h2>${esc(name)} plan</h2></div><button class="btn sm ghost" data-act="close" aria-label="Close">×</button></div>
   <form class="stack" style="gap:12px" data-form="planreq" data-id="${id}">
    <fieldset class="fs"><legend>How long</legend>
     <label class="row small" style="gap:8px"><input type="radio" name="term" value="month" checked style="width:16px"> 1 month · <b class="num">${fmt(m)}</b></label>
     <label class="row small" style="gap:8px"><input type="radio" name="term" value="year" style="width:16px"> 12 months · <b class="num">${fmt(m*10)}</b> <span class="pill p-yes">2 months free</span></label></fieldset>
    <div class="card small" style="background:var(--gold-soft)">Send the amount by Mobile Money to <b class="num">${esc(TV("plan.momo","Add your MoMo number"))}</b> (AfroVows), using your business name as the reference. Then tell us the transaction ID below.</div>
    <label class="f">MoMo transaction ID<input name="ref" id="pl-ref" required placeholder="e.g. 0123456789"></label>
    <div><button class="btn pri">Send request</button></div>
    <p class="small muted">The AfroVows team confirms the payment and switches on your plan, usually within a day.</p></form>`)}
function vVendorDash(){

    :l.status==="pending"?(l.live?"Your changes are waiting for approval. Couples still see your previous version until then.":"Thanks! The AfroVows team will review your listing. It appears in the directory once approved.")

   <div class="card small">${msg}</div>

   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;gap:20px">

     <h3>Your listing</h3><p class="small muted">Fields marked * are required. The more you share, the faster we can approve you.</p>
     <fieldset class="fs"><legend>Business</legend>
     <label class="f">Business name *<input name="name" id="ls-name" required value="${esc(l.name)}"></label>
     <div class="grid g2"><label class="f">Main service *<select name="cat" id="ls-cat">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===l.cat?"selected":""}>${c[1]}</option>`).join("")}</select></label>
     <label class="f">Ceremonies you cover *<select name="events" id="ls-ev">${[["both","Both ceremonies"],["eng","Traditional engagement"],["wed","White wedding"]].map(([v,t])=>`<option value="${v}" ${v===l.events?"selected":""}>${t}</option>`).join("")}</select></label>
     <label class="f">Town or city *<input name="city" id="ls-city" required value="${esc(l.city)}"></label>
     <label class="f">Region *<select name="region" id="ls-region">${REGIONS.map(r=>`<option ${r===l.region?"selected":""}>${r}</option>`).join("")}</select></label></div>
     <label class="f">Areas you travel to *<input name="areas" id="ls-areas" required value="${esc(l.areas)}" placeholder="e.g. All of Greater Accra and Eastern Region"></label>
     <div class="grid g2" id="ls-capbox" ${l.cat==="venues"?"":"hidden"}><label class="f">Smallest number of guests<input name="capMin" id="ls-capmin" type="number" min="0" inputmode="numeric" value="${esc(l.capMin)}" placeholder="e.g. 50"></label>
     <label class="f">Largest number of guests<input name="capMax" id="ls-capmax" type="number" min="0" inputmode="numeric" value="${esc(l.capMax)}" placeholder="e.g. 400"></label>
     <span class="small muted" style="grid-column:1/-1">Venue capacity. Leave the first box empty if there's no minimum.</span></div>
     <label class="f">Years in business<input name="years" id="ls-years" type="number" min="0" value="${esc(l.years)}"></label>
     <label class="f">About your service *<textarea name="blurb" id="ls-blurb" required placeholder="What you offer, your style, what makes you different">${esc(l.blurb)}</textarea></label></fieldset>
     <fieldset class="fs"><legend>Contact</legend><div class="grid g2">
     <label class="f">Contact person *<input name="contact" id="ls-contact" required value="${esc(l.contact)}"></label>
     <label class="f">WhatsApp / phone *<input name="phone" id="ls-phone" required inputmode="tel" value="${esc(l.phone)}"></label>
     <label class="f">Email *<input name="email" id="ls-email" type="email" required value="${esc(l.email||me)}"></label>
     </div><div class="stack" style="gap:6px"><span class="small muted" style="font-weight:600">Social media and website</span><div id="ls-socials" class="stack" style="gap:6px">${(socials(l).length?socials(l):[""]).map(socialRow).join("")}</div><div><button type="button" class="btn sm" data-act="addsocrow">+ Add another link</button></div><span class="small muted">Instagram, Facebook, TikTok, YouTube, X, your website, anything couples can use to see your work.</span></div></fieldset>
     <fieldset class="fs"><legend>Packages, fees and payment</legend>
     <div class="stack" style="gap:6px"><span class="small muted" style="font-weight:600">Packages and fees *</span><div id="ls-pks" class="stack" style="gap:10px">${((l.packages||[]).length?l.packages:[{}]).map(pkRow).join("")}</div><div><button type="button" class="btn sm" data-act="addpkrow">+ Add another package</button></div><span class="small muted">Leave the fee empty if couples should ask for a quote.</span></div>
     <label class="f">Deposit and payment terms *<input name="deposit" id="ls-deposit" required value="${esc(l.deposit)}" placeholder="e.g. 50% deposit to book, balance 1 week before. MoMo or bank transfer"></label></fieldset>
     <fieldset class="fs"><legend>Photos</legend>
     <div class="stack" style="gap:6px"><span class="small muted" style="font-weight:600">Cover photo <span style="font-weight:400">(the big picture at the top of your listing; upload one or tap "Make cover" on a work photo)</span></span><div class="row">${l.photo?`<img src="${l.photo}" alt="" style="width:96px;height:64px;object-fit:cover;border-radius:6px">`:""}<label class="btn sm" style="position:relative">${l.photo?"Change cover photo":"Upload cover photo"}<input type="file" accept="image/*" id="ls-photo" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div></div>

       ${(l.gallery||[]).length<6?`<label class="btn sm" style="position:relative;aspect-ratio:1;justify-content:center;border-style:dashed;max-width:100%">+ Add photos<input type="file" accept="image/*" multiple id="ls-gallery" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>`:""}</div></div></fieldset>
     <fieldset class="fs"><legend>Verification</legend>
     <p class="small muted">We check who owns each business before it goes live.</p>
     <div class="grid g2"><label class="f">Owner's ID type *<select name="idType" id="ls-idtype">${IDTYPES.map(t=>`<option ${t===l.idType?"selected":""}>${t}</option>`).join("")}</select></label>
     <label class="f">Owner's ID number *<input name="idNo" id="ls-idno" required value="${esc(l.idNo)}" placeholder="e.g. GHA-123456789-0" autocomplete="off"></label></div>
     <label class="f">Business registration number (Registrar-General) <input name="reg" id="ls-reg" value="${esc(l.reg)}" placeholder="Optional, helps us approve you faster"></label>
     <p class="small muted">Only the AfroVows team sees these numbers. They are never shown to couples.</p></fieldset>
     <div><button class="btn pri">${l.status==="draft"?"Submit for approval":"Save and resubmit for approval"}</button></div></form>
   <div class="stack" style="gap:8px"><span class="small muted" style="font-weight:600">How couples will see it</span>${vendorCard({...l,name:l.name||"Your business name",city:l.city||"Town",blurb:l.blurb||"A short description of what you offer.",packages:(l.packages||[]).length?l.packages:[{name:"Your first package",price:0}],phone:l.phone||"Your number",sample:false,unverified:true})}</div></div></div>`;
}

  ownerBio:"Add a short introduction here: where you're from, your background, and what Ghanaian weddings mean to you.",
  motivation:"Planning a wedding in Ghana means planning two celebrations: the traditional engagement and the white wedding. Couples juggle the engagement list, vendors found through friends of friends, prices that change with every phone call, and guest lists spread across WhatsApp groups.\n\nWe built AfroVows to bring all of that into one place. Anyone can browse a free directory of checked vendors with clear prices in cedis, and couples get private tools to plan with their partner and family, so they spend less time chasing details and more time celebrating.",

  values:[["Built for Ghana","Two ceremonies, prices in cedis, Mobile Money and WhatsApp, the way weddings really happen here."],["Trust first","Every vendor is reviewed before going live, and couples share honest reviews."],["Your details stay private","Couples' plans are only visible to the people they invite."]],

const setAbout=a=>store.set(ABKEY,JSON.stringify(a));
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
const avatar=(src,name,size)=>src?`<img class="avatar" src="${src}" alt="${esc(name)}" style="width:${size}px;height:${size}px">`:`<span class="avatar" aria-hidden="true" style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px">${esc(initials(name))}</span>`;

function collectAbout(){const f=document.querySelector('[data-form="about"]');const A=about();if(!f)return A;const d=Object.fromEntries(new FormData(f));

const EVNAME={both:"Engagement and white wedding",eng:"Traditional engagement",wed:"White wedding"};
function adminDetails(l){
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";const t=x=>x?esc(String(x)):"";
  const pv=l.live&&l.status==="pending"?l.live:null;
  const changed=pv?[["name","Business name"],["cat","Service"],["events","Ceremonies"],["city","Town"],["region","Region"],["areas","Areas"],["years","Years"],["blurb","About"],["contact","Contact person"],["phone","Phone"],["email","Email"],["deposit","Payment terms"],["photo","Cover photo"]].filter(([k])=>(pv[k]||"")!==(l[k]||"")).map(x=>x[1])
    .concat(JSON.stringify(pv.packages||[])!==JSON.stringify(l.packages||[])?["Packages"]:[],JSON.stringify(socials(pv))!==JSON.stringify(socials(l))?["Social links"]:[],(pv.gallery||[]).map(g=>g.src).join()!==(l.gallery||[]).map(g=>g.src).join()?["Work photos"]:[]):[];

function replyMail(m){const when=new Date(m.at).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const body=`Hello ${m.name},\n\nThank you for contacting AfroVows.\n\n\n\nKind regards,\nThe AfroVows team\n\n---\nOn ${when} you wrote:\n${m.msg.split("\n").map(l=>"> "+l).join("\n")}`;
  return "mailto:"+encodeURIComponent(m.email).replace(/%40/g,"@")+"?subject="+encodeURIComponent("Re: Your message to AfroVows")+"&body="+encodeURIComponent(body)}
/* A yearly plan is paid as 10 months for 12, so its monthly value is the amount paid spread over 12 months. */
function planTermOf(l){return l.planTerm||(l.planUntil&&l.planUntil-Date.now()>62*864e5?"year":"month")}
function planPaidOf(l){return l.planPaid||planPrice(planOf(l))*(planTermOf(l)==="year"?10:1)}
function planMonthly(l){return planPaidOf(l)/(planTermOf(l)==="year"?12:1)}

/* ---------- Photos ---------- */
function shrink(file,mx){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=mx||900,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function bindUploads(){const f=$("#ph-file");if(!f)return;f.onchange=async()=>{const by=($("#ph-by").value||"").trim();if(!by){toast("Add your name first so the couple knows who shared it");f.value="";$("#ph-by").focus();return}
  let n=0;for(const file of f.files){try{const src=await shrink(file);
    if(HOSTED&&mode==="guest"){const code=myCode(),path="guest/"+code+"/"+rid()+".jpg";const up=await DBX.sb.storage.from("media").upload(path,dataUrlBlob(src),{contentType:"image/jpeg"});if(up.error)throw up.error;
      const url=DBX.sb.storage.from("media").getPublicUrl(path).data.publicUrl;const {data:ok}=await DBX.sb.rpc("guest_add_photo",{wcode:code,by_name:by,url});if(!ok)throw new Error("rejected");S.photos.unshift({id:uid(),by,src:url,at:Date.now()})}
    else S.photos.unshift({id:uid(),by,src,at:Date.now()});n++}catch(e){console.error(e)}}
  if(!(HOSTED&&mode==="guest"))save();toast(n?`${n} photo${n>1?"s":""} added. Thank you!`:"That file couldn't be read as a photo");rerender()}}

      const yes=Object.values(g.rsvp).includes("yes");$("#rsvp-out").innerHTML=`<p style="margin-top:8px"><b>Medaase, ${esc(g.name.split(" ")[0])}!</b> ${yes?"We can't wait to celebrate with you.":"We'll miss you, and thank you for letting us know."} Your reply is now in the couple's RSVP tracker.</p>`;break}
  }
});
if(HOSTED){try{await dbAfter()}catch(e){console.error(e);$("#app").innerHTML='<div class="empty">We couldn\'t open your wedding just now. Check your connection and refresh the page.</div>';return}}
route();
try{const m=sessionStorage.getItem("afrovows.toast");if(m){sessionStorage.removeItem("afrovows.toast");toast(m)}}catch(e){}
})();
</script>
